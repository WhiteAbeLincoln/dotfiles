# Schema globalhawk secrets allowing generation/regeneration
# Run all fields with:
#   nix run .#populate-sops -- \
#     secrets/globalhawk-secrets-schema.toml secrets/globalhawk.sops.yaml
#
# Re-run only one app with, for example:
#   nix run .#populate-sops -- ... --tag immich

version = 1

[[fields]]
name = "immich_oidc_client_secret"
mode = "generated"
generator = "token_urlsafe"
bytes = 48
tags = ["oidc", "immich"]

[[fields]]
name = "immich_oidc_client_secret_hash"
mode = "derived"
source = "immich_oidc_client_secret"
derivation = "authelia_argon2"
tags = ["oidc", "immich"]

[[fields]]
name = "immich_admin_api_key"
mode = "fixed"
description = "Immich API key with system-config read/update permissions"
tags = ["oidc", "immich", "operator"]

[[fields]]
name = "abs_oidc_client_secret"
mode = "generated"
generator = "token_urlsafe"
bytes = 48
tags = ["oidc", "audiobookshelf"]

[[fields]]
name = "abs_oidc_client_secret_hash"
mode = "derived"
source = "abs_oidc_client_secret"
derivation = "authelia_argon2"
tags = ["oidc", "audiobookshelf"]

[[fields]]
name = "abs_admin_token"
mode = "fixed"
description = "active Audiobookshelf API key assigned to the root/admin user"
tags = ["oidc", "audiobookshelf", "operator"]

[[fields]]
name = "cwa_oidc_client_secret"
mode = "generated"
generator = "token_urlsafe"
bytes = 48
tags = ["oidc", "calibre-web"]

[[fields]]
name = "cwa_oidc_client_secret_hash"
mode = "derived"
source = "cwa_oidc_client_secret"
derivation = "authelia_argon2"
tags = ["oidc", "calibre-web"]

[[fields]]
name = "grafana_admin_password"
mode = "generated"
description = "Grafana local administrator password used for break-glass access"
generator = "token_urlsafe"
bytes = 48
tags = ["observability", "grafana"]

[[fields]]
name = "grafana_oidc_client_secret"
mode = "generated"
description = "OIDC client secret shared by Grafana and Authelia"
generator = "token_urlsafe"
bytes = 48
tags = ["oidc", "observability", "grafana"]

[[fields]]
name = "grafana_oidc_client_secret_hash"
mode = "derived"
description = "Argon2 digest used by Authelia to verify Grafana's OIDC client secret"
source = "grafana_oidc_client_secret"
derivation = "authelia_argon2"
tags = ["oidc", "observability", "grafana"]

[[fields]]
name = "plex_api_token"
mode = "fixed"
description = "Plex administrator API token used by the metrics collector; obtain it from an authenticated Plex Web request or the XML for a Plex item"
tags = ["observability", "plex", "operator"]

[[fields]]
name = "adguard_metrics_password"
mode = "fixed"
description = "Existing AdGuard Home admin account password used by the metrics collector; manage it in the AdGuard Home web interface under Settings > Users"
tags = ["observability", "adguard", "operator"]
